name: ISPC Refresh Artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches:
      - main
    paths:
      - 'data/ispc/**'
      - 'tools/**'
      - 'docs/assets/js/**'

permissions:
  contents: write

concurrency:
  group: ispc-refresh-artifacts-main
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Refresh artifacts
        run: |
          python tools/ispc_refresh_dashboard_artifacts.py --repo .

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/ispc docs/assets/js
            git commit -m "chore: refresh ISPC artifacts"
            git push
          else
            echo "No changes to commit"
          fi
